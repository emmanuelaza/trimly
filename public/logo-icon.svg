<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Blue rounded square background -->
  <rect width="100" height="100" rx="22" fill="#3B7FF5"/>

  <!-- Rocket upper blade (right wing + nose going upper-right) -->
  <path d="M 64,11 C 74,15 86,27 84,44 L 57,70 L 40,53 C 43,36 52,19 64,11 Z" fill="white"/>

  <!-- Rocket second blade (lower wing, pivot to lower-right) -->
  <path d="M 80,48 C 87,59 83,73 70,77 L 52,66 L 57,60 C 65,54 74,50 80,48 Z" fill="white"/>

  <!-- Window on rocket body -->
  <circle cx="66" cy="37" r="6" fill="#3B7FF5" opacity="0.35"/>
  <circle cx="66" cy="37" r="3.5" fill="#3B7FF5" opacity="0.55"/>

  <!-- Pivot screw — upper circle -->
  <circle cx="53" cy="62" r="5.5" fill="white"/>
  <circle cx="53" cy="62" r="2.8" fill="#3B7FF5"/>

  <!-- Pivot screw — lower circle -->
  <circle cx="45" cy="71" r="5" fill="white"/>
  <circle cx="45" cy="71" r="2.5" fill="#3B7FF5"/>

  <!-- Connector between pivot circles -->
  <rect x="41" y="59" width="15" height="14" rx="3" fill="white"/>
  <rect x="44" y="61" width="9" height="10" rx="2" fill="#3B7FF5" opacity="0.3"/>

  <!-- Exhaust flame 1 -->
  <path d="M 38,76 C 28,84 17,86 8,88 C 12,78 22,70 34,68 Z" fill="white" opacity="0.90"/>

  <!-- Exhaust flame 2 -->
  <path d="M 31,83 C 21,90 11,92 4,93 C 8,84 18,78 28,76 Z" fill="white" opacity="0.60"/>

  <!-- Spark dots -->
  <circle cx="20" cy="44" r="2.5" fill="white" opacity="0.85"/>
  <circle cx="13" cy="53" r="2" fill="white" opacity="0.75"/>
  <circle cx="25" cy="57" r="1.8" fill="white" opacity="0.70"/>
  <circle cx="11" cy="40" r="1.5" fill="white" opacity="0.55"/>
  <circle cx="18" cy="62" r="1.5" fill="white" opacity="0.55"/>
</svg>
